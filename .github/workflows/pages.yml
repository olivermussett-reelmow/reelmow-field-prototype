name: Deploy REELMOW

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f app.js
          test -f styles.css
          echo "Pages source verified:"
          ls -la
          echo "index.html found at repository root."

      - name: Configure runtime configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const url = process.env.SUPABASE_URL || '';
          const key = process.env.SUPABASE_PUBLISHABLE_KEY || '';
          const js = 'window.REELMOW_CONFIG = ' + JSON.stringify({ url, key }) + ';\n';
          fs.writeFileSync('reelmow.config.js', js, 'utf8');
          NODE
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -s reelmow.config.js
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('reelmow.config.js','utf8');
          if (!text.includes('window.REELMOW_CONFIG')) throw new Error('Runtime config was not generated correctly');
          const prefix = 'window.REELMOW_CONFIG = ';
          if (!cfg.url || !cfg.key) throw new Error('Supabase runtime configuration is empty');
          console.log('Runtime configuration verified for artifact:', cfg.url);
          NODE
          echo "Runtime configuration generated and verified for the Pages artifact."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
