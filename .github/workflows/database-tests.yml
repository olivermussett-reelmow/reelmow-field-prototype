name: REELMOW Database Tests

on:
  push:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/database-tests.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - '.github/workflows/database-tests.yml'
  workflow_dispatch:

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Report Supabase CLI
        run: |
          supabase --version
          supabase migration list || true

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from migrations
        run: supabase db reset --debug

      - name: Run database tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop
