name: REELMOW Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check service worker syntax
        run: node --check sw.js
      - name: Verify required frontend files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s sw.js
          test -s manifest.webmanifest
          test -s icon.svg
          grep -q 'reelmow.config.js' index.html
          grep -q 'Today' app.js
          grep -q 'quick-actions' app.js
          grep -q 'machine_faults' app.js
          echo "REELMOW static quality checks passed."
